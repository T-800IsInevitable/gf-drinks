name: Check pull request

# The same build and checks as publishing (.github/actions/build-check), on every pull request, so problems
# show up before merging. Nothing is published from here. main requires this
# check to pass, so it runs on every pull request (no paths-ignore: a skipped
# required check would block merging). The guide watch starts it by hand
# (workflow_dispatch) on the pull requests it opens, because a pull request
# opened with the workflow's own token doesn't start it.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: ./.github/actions/build-check
        with:
          release-base: ${{ github.base_ref || 'main' }}
