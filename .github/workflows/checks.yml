name: Check pull request

# The same build and checks as publishing (.github/actions/build-check), on every pull request, so problems
# show up before merging. Nothing is published from here. main requires this
# check to pass, so it runs on every pull request (no paths-ignore: a skipped
# required check would block merging). The guide watch starts it by hand
# (workflow_dispatch) on the pull requests it opens, because a pull request
# opened with the workflow's own token doesn't start it. "edited" re-runs it when
# the base branch is changed, so it's judged against the new base; it runs on
# every edit, with no "if" to skip the others, because a skipped required check
# counts as passed and would hide an earlier failure.
on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04  # not ubuntu-latest: Playwright's WebKit needs Ubuntu 24.04's libraries (ubuntu-latest is now 26.04)
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: ./.github/actions/build-check
        with:
          release-base: ${{ github.base_ref || 'main' }}
