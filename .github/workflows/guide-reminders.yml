name: Guide reminders

# Each morning, open an issue for any restaurant guide that has ended or ends
# within three weeks (one issue per guide and end date; see tools/reminders.py).
on:
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  remind:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install PDF reader
        run: pip install -r tools/requirements.txt

      - name: Build menus to read their end dates
        run: python tools/build.py

      - name: Open reminders
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python tools/reminders.py --github
