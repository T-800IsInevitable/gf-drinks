name: Guide reminders

# Each morning, open an issue for any restaurant guide that has ended or ends
# within three weeks (one issue per guide and end date; see tools/reminders.py).
# The end dates come from the live index, so nothing is built here.
on:
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  remind:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Download the menus that are live now, for their end dates
        run: python tools/fetch_previous.py

      - name: Open reminders
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python tools/reminders.py --github --index .previous/restaurants.json
