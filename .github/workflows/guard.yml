name: Guard pull request

# Judges every pull request by main's own rules. pull_request_target runs this file and the tools as they are on
# main, whatever the pull request changes, so a pull request can't loosen the checks that judge it (checks.yml runs
# the pull request's own copy). Nothing from the pull request is run: only its menu and city files are read, as data.
#  - A routine's or a workflow's pull request (branches scan/, city/, recheck/, guide-watch/) may change only its own
#    files, and a pull request carrying one of their commits must be on such a branch (tools/guard.py). A scan/ branch
#    for a restaurant a reader already builds may add only guides and source files; a city/ or recheck/ branch may
#    change only the city it names.
#  - Its menus and cities are built and checked with main's tools/build.py and tools/check.py, against the live menus
#    (so the Avoid-drop guard runs), and none of those files may be a symbolic link or a submodule.
# The token reads only, and no secret is used here. main requires this check (job "guard") to pass.
on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read

jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - run: |
          pip install --require-hashes -r tools/requirements-buildtools-lock.txt
          pip install --require-hashes --no-build-isolation -r tools/requirements-lock.txt

      # the branch name goes in through the environment, never into the script's text
      - name: A routine's pull request changes only its own files
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: python tools/guard.py

      - name: Its menus and cities, built and checked by main's rules
        env:
          PR: ${{ github.event.pull_request.number }}
        run: |
          git fetch --no-tags --depth=1 origin "refs/pull/$PR/head"
          # files only: the build copies logos and guides into the site, and would follow a link to wherever it points
          modes="$(git ls-tree -r FETCH_HEAD -- restaurants site/cities.json)"
          if grep -E '^(120000|160000) ' <<<"$modes"; then
            echo "GUARD: symbolic links and submodules aren't allowed in restaurants/ or as site/cities.json"
            exit 1
          fi
          rm -rf restaurants
          git checkout FETCH_HEAD -- restaurants site/cities.json
          # the live menus, so main's Avoid-drop guard (tools/build.py avoid_drop) judges the pull request's menus; without
          # them it has nothing to compare and is skipped, leaving only checks.yml's run of the pull request's own tools
          python tools/fetch_previous.py
          python tools/build.py
          python tools/check.py
