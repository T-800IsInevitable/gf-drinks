name: Keep scheduled workflows alive

# GitHub disables a scheduled workflow in a public repository after 60 days
# with no repository activity (see assessment finding O1). Guide seasons can
# leave the repo quiet that long, so this makes a small monthly commit to a
# file the publish workflow ignores (paths-ignore: inbox/**), which counts as
# activity without triggering a deploy or touching anything the app serves.
on:
  schedule:
    - cron: "0 6 1 * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Record that this ran
        run: |
          mkdir -p inbox
          date -u +"Checked %Y-%m-%dT%H:%M:%SZ" > inbox/.keep-alive

      - name: Commit if it's new
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add inbox/.keep-alive
          git diff --cached --quiet || git commit -m "Keep scheduled workflows alive"
          git push
