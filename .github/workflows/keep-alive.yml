name: Keep scheduled workflows alive

# GitHub switches off a public repository's scheduled workflows after 60 days
# with no repository activity, which can happen between guide seasons. Each
# month this re-enables them through GitHub's API (the approach keep-alive
# actions use, needing only actions: write), so nothing is committed and main
# can stay protected. GitHub's docs don't say whether this resets the 60 days,
# so the daily inbox scan also checks their state and re-enables any that were
# switched off (tools/SCAN_INSTRUCTIONS.md, step 0).
on:
  schedule:
    - cron: "0 6 1 * *"
  workflow_dispatch:

permissions:
  actions: write

jobs:
  keep:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Re-enable the scheduled workflows
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          for wf in guide-reminders.yml guide-watch.yml keep-alive.yml upload-notice.yml; do
            gh api -X PUT "repos/$REPO/actions/workflows/$wf/enable"
            echo "$wf: $(gh api "repos/$REPO/actions/workflows/$wf" --jq .state)"
          done
