name: Build menu and publish app

# On every push to main: the same build and checks as the pull request check
# (.github/actions/build-check), then the site goes to GitHub Pages.
on:
  push:
    branches: [main]
    paths-ignore:
      - "inbox/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: ./.github/actions/build-check

      # what to tell the phones once this is live: only a publish that brought a new guide says anything
      - name: Work out the notification for this publish
        run: python tools/push.py --plan --out push-message.json

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: push-message
          path: push-message.json
          retention-days: 3

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5

  # One push notification per publish with a new guide, to the phones saved in the PUSH_SUBSCRIPTIONS secret
  # (tools/push.py). With no phones saved, or nothing new, it says so and does nothing. It never fails the publish.
  notify:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: push-message

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      # by hash (tools/requirements-notify-lock.txt): this job holds the push secrets, so nothing unverified runs in it,
      # the build tools included (http-ece ships as source and needs setuptools to build)
      - run: |
          pip install --require-hashes -r tools/requirements-buildtools-lock.txt
          pip install --require-hashes --no-build-isolation -r tools/requirements-notify-lock.txt

      - name: Tell the phones about new menus
        env:
          PUSH_SUBSCRIPTIONS: ${{ secrets.PUSH_SUBSCRIPTIONS }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python tools/push.py --send push-message.json
