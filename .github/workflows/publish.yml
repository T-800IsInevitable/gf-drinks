name: Build menu and publish app

# On every push to main: the same build and checks as the pull request check
# (.github/actions/build-check), then the site goes to GitHub Pages. Also every Monday, so the chains' branch list
# (tools/fetch_branches.py) is never more than a week old even in a week with nothing else to publish.
on:
  push:
    branches: [main]
    paths-ignore:
      - "inbox/**"
  schedule:
    - cron: "30 4 * * 1"
  workflow_dispatch:

# each job has only what it needs: publishing to Pages (pages: write, id-token: write) is the deploy job's alone
permissions:
  contents: read

# Two merges close together: the newer build and deploy cancel the older ones (only the newest deploy waits for
# approval), but nothing cancels a notify, so a deploy that went live still sends its message. Set on the jobs, not the
# run: a whole run waiting for approval would otherwise hold every later run behind it, or be cancelled with its notify.

jobs:
  build:
    runs-on: ubuntu-24.04  # not ubuntu-latest: Playwright's WebKit needs Ubuntu 24.04's libraries (ubuntu-latest is now 26.04)
    timeout-minutes: 45 # the checks (with a slow package mirror) and the branch list's twelve minutes
    concurrency:
      group: pages-build
      cancel-in-progress: true
    permissions:
      contents: read
      pages: read # configure-pages reads the Pages settings
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # the release check again, against main as it was before this push: two pull requests that each raised the
      # release to the same number both pass their own checks, and phones would never load the second one's code.
      # A scheduled or manual run publishes main unchanged, so it skips the check.
      - uses: ./.github/actions/build-check
        with:
          release-base: ${{ github.event_name == 'push' && github.event.before || '' }}

      # every UK branch of the chains, from OpenStreetMap, for the map and Near me: asked on the Monday run (and by
      # hand); a push publishes the live list again while it's under a week old. A busy or broken answer keeps the live
      # list, and nothing here fails the publish (the pull request check doesn't ask: its UI checks bring their own list)
      - name: Fetch the chains' branches
        timeout-minutes: 12
        continue-on-error: true
        run: python tools/fetch_branches.py ${{ github.event_name == 'push' && '--reuse-days 7' || '' }}

      - name: Check the branch list with everything else
        run: python tools/check.py

      # what to tell the phones once this is live: only a publish that brought a new guide says anything
      - name: Work out the notification for this publish
        run: python tools/push.py --plan --out push-message.json

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: push-message
          path: push-message.json
          retention-days: 3

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: pages
      cancel-in-progress: true
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5

  # One push notification per publish with a new guide, to the phones saved in the PUSH_SUBSCRIPTIONS secret
  # (tools/push.py). With no phones saved, or nothing new, it says so and does nothing. It never fails the publish.
  notify:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # the push secrets live in the "notify" environment, which only main may use: a workflow run from any other branch
    # (a pull request's own copy, or one started by hand there) can't read them
    environment: notify
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: push-message

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      # by hash (tools/requirements-notify-lock.txt): this job holds the push secrets, so nothing unverified runs in it,
      # the build tools included (http-ece ships as source and needs setuptools to build)
      - run: |
          pip install --require-hashes -r tools/requirements-buildtools-lock.txt
          pip install --require-hashes --no-build-isolation -r tools/requirements-notify-lock.txt

      - name: Tell the phones about new menus
        env:
          PUSH_SUBSCRIPTIONS: ${{ secrets.PUSH_SUBSCRIPTIONS }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python tools/push.py --send push-message.json
