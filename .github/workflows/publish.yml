name: Build menu and publish app

on:
  push:
    branches: [main]
    paths-ignore:
      - "inbox/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install PDF reader
        run: pip install -r tools/requirements.txt

      # The live menus, so the build can say what changed in a new guide (tools/changes.py)
      - name: Download the menus that are live now
        run: python tools/fetch_previous.py

      - name: Build every restaurant's menu
        run: |
          set -o pipefail
          { python -m unittest discover -s tests && python tools/build.py && python tools/check.py && python tools/snapshot.py; } | tee build.log
          {
            echo "## Menu build"
            echo '```'
            cat build.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Install the browser for UI checks
        run: |
          pip install -r tools/requirements-dev.txt
          python -m playwright install --with-deps chromium

      - name: Check the app at iPhone size, light and dark
        run: python tools/ui_check.py

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
