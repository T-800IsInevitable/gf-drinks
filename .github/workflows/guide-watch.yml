name: Guide watch

# Each week, look on every watched restaurant's own website for a new allergen
# guide (tools/watch_guides.py). A new one becomes a pull request with the PDF
# in guides/, for the owner to read and merge; nothing merges by itself. A page
# that can't be checked, or a new guide for a menu kept by hand, opens an issue.
#
# Two jobs, so the token that can push never sits beside a PDF from another site (V14): fetch reads the websites and
# the PDFs with no permissions at all and saves a plan; propose holds the write token, installs no PDF reader, reads
# no website, and checks the plan against its own checkout before acting on it.
on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions: {}

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30  # it reads PDFs from other sites: one that stalls the reader mustn't hold a runner for hours
    permissions: {}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      # by hash, as in every other job
      - name: Install PDF reader
        run: |
          pip install --require-hashes -r tools/requirements-buildtools-lock.txt
          pip install --require-hashes --no-build-isolation -r tools/requirements-lock.txt

      - name: Download the menus that are live now, to say what a new guide changes
        run: python tools/fetch_previous.py

      - name: Look for new guides
        run: python tools/watch_guides.py --plan "$RUNNER_TEMP/plan"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: guide-watch-plan
          path: ${{ runner.temp }}/plan
          retention-days: 7

  propose:
    needs: fetch
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write       # push the new guide's branch (main stays protected)
      pull-requests: write
      issues: write
      actions: write        # start the checks on the pull request
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: guide-watch-plan
          path: ${{ runner.temp }}/plan

      # the standard library only: nothing here reads a PDF
      - name: Open the pull requests and issues
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python tools/watch_guides.py --propose "$RUNNER_TEMP/plan"
