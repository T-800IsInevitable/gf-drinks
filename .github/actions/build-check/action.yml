name: Build and check the menus
description: >
  The same steps for the pull request check and for publishing: set up Python, download the live menus to compare
  with, run the unit tests, build, check and snapshot every menu (summarised on the run), then, with the test
  browsers cached by their version, check the app at iPhone size. The required check and the publish job keep their
  own names, so main's branch protection isn't affected.

inputs:
  release-base:
    description: The git ref to compare app code with for the release-number check; empty skips that check.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
      with:
        python-version: "3.12"
        cache: pip
        cache-dependency-path: tools/requirements.lock

    # every package by its hash (tools/requirements.lock, from uv pip compile), so a tampered release can't get in
    - name: Install the PDF reader and test tools
      shell: bash
      run: pip install --require-hashes -r tools/requirements.lock

    - name: Download the menus that are live now
      shell: bash
      run: python tools/fetch_previous.py

    - name: Build and check every restaurant's menu
      shell: bash
      run: |
        set -o pipefail
        { python -m unittest discover -s tests && python tools/build.py && python tools/check.py && python tools/snapshot.py; } | tee build.log
        {
          echo "## Menu build"
          echo '```'
          cat build.log
          echo '```'
        } >> "$GITHUB_STEP_SUMMARY"

    - name: Check the release number went up with any app code change
      if: inputs.release-base != ''
      shell: bash
      run: |
        git fetch --depth=1 origin "${{ inputs.release-base }}"
        python tools/check_release.py FETCH_HEAD

    # the browsers by Playwright's version, so a run doesn't download them (the step that has stalled before)
    - name: Remember which Playwright this is
      id: pw
      shell: bash
      run: echo "version=$(python -m playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"

    - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      id: browsers
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}

    - name: Install the browsers for the UI checks
      if: steps.browsers.outputs.cache-hit != 'true'
      shell: bash
      run: python -m playwright install chromium webkit

    # Ubuntu's Azure package mirror sometimes crawls (a 24-minute install of WebKit's libraries). Give it eight minutes,
    # then switch the runner to Ubuntu's own archive and try once more, rather than sit until the job's timeout.
    - name: Install what the browsers need from the system
      shell: bash
      run: |
        timeout 8m python -m playwright install-deps chromium webkit && exit 0
        echo "::warning::The package mirror was too slow; trying Ubuntu's own archive"
        sudo dpkg --configure -a || true  # the timeout may have cut apt off mid-install
        sudo sed -i 's|azure.archive.ubuntu.com|archive.ubuntu.com|g' /etc/apt/sources.list /etc/apt/sources.list.d/*.sources /etc/apt/sources.list.d/*.list 2>/dev/null || true
        sudo apt-get update -qq
        timeout 10m python -m playwright install-deps chromium webkit

    - name: Check the app at iPhone size, light and dark
      shell: bash
      run: python tools/ui_check.py
