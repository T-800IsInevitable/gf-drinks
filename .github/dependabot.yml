# Keeps the workflow actions' pinned commit ids current (one grouped pull request a month at most, checked like any
# other; the composite action's pins are listed as their own directory, since Dependabot doesn't follow local
# references), and opens a pull request when one of the Python packages the jobs install has a known vulnerability
# (the locks are .txt files because that is all Dependabot's pip support reads). No routine version bumps for Python:
# the readers are checked against the pinned versions, and a bump is a deliberate change.
version: 2
updates:
  - package-ecosystem: github-actions
    directories: ["/", "/.github/actions/build-check"]
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: pip
    directory: /tools
    schedule:
      interval: monthly
    open-pull-requests-limit: 0
